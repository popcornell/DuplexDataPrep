# nsf_chorus: NOTSOFAR-1 close-talk headset tracks, Sidon-restored to 24 kHz by
# the same pipeline Fisher uses. One mono <Speaker>.wav per participant.
#
# This corpus exists for its manifest stage: every split already carries word
# times, so it never needs a forced-alignment run.
name: nsf_chorus

# <root>/manifest.jsonl + <root>/<split>/<meeting>/<Speaker>.wav
root: /work/hdd/bbjs/cornell2/nsf_chorus/nsf_chorus

# Which supervisions `iter_channels` / `collect` read. `all` is the dev+train
# merge; `dev`, `train` or `eval` selects that split's own file.
split: all

# Word times. nsf_chorus itself has utterance-level text only, so they come from
# two annotation copies that sit on the same timeline as the restored audio.
#
#   dev   -- the raw release's gt_transcription.json (word_timing on 98.1 %)
#   train -- CHiME-8 DASR transcriptions
#   eval  -- CHiME-8 DASR transcriptions
#
# CHiME-8's `train` directory holds NOTSOFAR's train *and* dev meetings; the
# split sidecar decides which are kept, so the overlap is harmless.
dev_ground_truth: /scratch/bbjs/cornell2/CHiME6/tmp_chimeutils/notsofar1_gt_dev_old/dev_set/240130.1_dev_with_GT_delme/MTG
chime8_transcriptions: /scratch/bbjs/cornell2/CHiME6/tmp_chimeutils/full_dasr_with_gt_new/notsofar1/transcriptions

manifests:
  dir: /scratch/bbjs/cornell2/MFA/out/manifests
  recordings: notsofar_recordings_24k.jsonl.gz
  supervisions: "notsofar_supervisions_{split}.jsonl.gz"
  # dev + train. Eval is the benchmark split and is kept out of the default.
  merged: notsofar_supervisions.jsonl.gz
  # A recording manifest has nowhere to carry the split, so it goes beside it.
  meta: notsofar_meta.json
